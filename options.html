<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Yeedio Settings</title>
    <style>
        :root {
            --paper: #f4f4f0;
            --card: #ffffff;
            --line: #dcdcd6;
            --ink: #19191c;
            --muted: #727278;
            --purple: #6c47ff;
            --purple-soft: #ded7ff;
            --acid: #c9fa68;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(rgba(25, 25, 28, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 25, 28, 0.035) 1px, transparent 1px),
                var(--paper);
            background-size: 32px 32px;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 36px;
            width: 420px;
            height: fit-content;
            box-shadow: 0 1px 3px rgba(25, 25, 28, 0.08), 0 12px 40px rgba(25, 25, 28, 0.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand img {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            box-shadow: 0 1px 3px rgba(25, 25, 28, 0.15);
        }

        h2 {
            margin: 0;
            font-size: 23px;
            font-weight: 800;
            color: var(--ink);
        }

        .setting-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            font-family: 'DM Mono', 'Consolas', monospace;
            font-size: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(108, 71, 255, 0.15);
        }

        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 13px;
            background: var(--purple);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(108, 71, 255, 0.28);
            transition: filter 0.15s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 14px;
            text-align: center;
            font-family: 'DM Mono', 'Consolas', monospace;
            font-size: 12.5px;
            color: #3d5b12;
            min-height: 20px;
        }

        .hint {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            font-size: 12.5px;
            line-height: 1.8;
            color: var(--muted);
        }

        .hint strong {
            color: var(--ink);
        }

        .hint kbd {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 1px 6px;
            font-family: 'DM Mono', 'Consolas', monospace;
            font-size: 11px;
            color: var(--ink);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brand">
            <img src="icons/icon48.png" alt="Yeedio">
            <h2>Yeedio Settings</h2>
        </div>

        <div class="setting-group">
            <label for="default-speed">Saved video speed (0.25x – 16x)</label>
            <input type="number" id="default-speed" min="0.25" max="16" step="0.25" value="1.0">
        </div>

        <div class="setting-group">
            <label for="default-volume">Saved volume boost (0% – 600%)</label>
            <input type="number" id="default-volume" min="0" max="600" step="1" value="100">
        </div>

        <button id="save-btn">Save settings</button>
        <div id="status" class="status"></div>

        <div class="hint">
            <strong>Keyboard shortcuts</strong><br>
            <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd> — open Yeedio<br>
            <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>,</kbd> / <kbd>.</kbd> — decrease / increase speed<br>
            You can customize volume shortcuts at <em>chrome://extensions/shortcuts</em>
        </div>
    </div>
    <script src="options.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Yeedio</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="header">
        <div class="brand">
            <img src="icons/icon48.png" alt="" class="brand-icon">
            <h1>Yeedio</h1>
        </div>
        <button id="open-options" class="icon-btn" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </header>

    <main class="content">
        <!-- Video Speed -->
        <section class="card">
            <div class="card-head">
                <span class="card-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Speed
                </span>
                <div class="value-box">
                    <input type="number" id="speed-input" min="0.25" max="16" step="0.25" value="1.00">
                    <span class="unit">x</span>
                </div>
            </div>
            <div class="slider-row">
                <button id="speed-down" class="step-btn" title="Decrease (-0.25x)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <input type="range" id="speed-slider" class="slider" min="0.25" max="16" step="0.25" value="1"
                    aria-label="Video speed">
                <button id="speed-up" class="step-btn" title="Increase (+0.25x)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
            <div class="chips" id="speed-presets">
                <button class="chip" data-speed="1">1x</button>
                <button class="chip" data-speed="1.25">1.25x</button>
                <button class="chip" data-speed="1.5">1.5x</button>
                <button class="chip" data-speed="2">2x</button>
                <button class="chip" data-speed="3">3x</button>
            </div>
        </section>

        <!-- Volume Booster -->
        <section class="card">
            <div class="card-head">
                <span class="card-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    Volume Boost
                </span>
                <div class="value-box">
                    <input type="number" id="volume-input" min="0" max="600" step="1" value="100">
                    <span class="unit">%</span>
                </div>
            </div>
            <div class="slider-row">
                <input type="range" id="volume-slider" class="slider" min="0" max="600" step="1" value="100"
                    aria-label="Volume boost">
            </div>
            <div class="chips" id="volume-presets">
                <button class="chip" data-volume="100">100%</button>
                <button class="chip" data-volume="150">150%</button>
                <button class="chip" data-volume="200">200%</button>
                <button class="chip" data-volume="400">400%</button>
                <button class="chip" data-volume="600">600%</button>
            </div>
        </section>

        <!-- Now Playing -->
        <section class="card now-playing">
            <span class="np-label">Now Playing</span>
            <div class="np-content">
                <img id="active-tab-icon" alt="" hidden>
                <span id="active-tab-title">Loading&hellip;</span>
            </div>
        </section>

        <div id="status" class="status">Checking page&hellip;</div>
    </main>

    <script src="popup.js"></script>
</body>

</html>
